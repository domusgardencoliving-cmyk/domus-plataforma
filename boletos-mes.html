<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boletos do Mês · Domus DG Gestão</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #F7F4ED; color: #2C3E50; }
  .azul-domus { color: #008B9C; }
  .bg-azul-domus { background: #008B9C; }
  .bg-azul-profundo { background: #0A3142; }
  .border-domus { border-color: #C9A961; }
  .input-num { width: 110px; text-align: right; padding: 6px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  .input-num:focus { outline: none; border-color: #008B9C; box-shadow: 0 0 0 3px rgba(0,139,156,0.1); }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; display: inline-block; }
  .badge-pendente { background: #FEF3C7; color: #92400E; }
  .badge-emitido { background: #DBEAFE; color: #1E40AF; }
  .badge-pago { background: #D1FAE5; color: #065F46; }
  .badge-erro { background: #FEE2E2; color: #991B1B; }
  .row:hover { background: #FAF7F0; }
  .total-cell { font-weight: 700; color: #008B9C; }
  .btn { padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; transition: all .15s; cursor: pointer; }
  .btn-emit { background: #008B9C; color: white; }
  .btn-emit:hover { background: #0A3142; }
  .btn-emit:disabled { background: #ccc; cursor: not-allowed; }
  .btn-ghost { border: 1px solid #ddd; background: white; color: #2C3E50; }
  .btn-ghost:hover { border-color: #008B9C; color: #008B9C; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(10,49,66,0.6); backdrop-filter: blur(4px); z-index: 50; display: none; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: white; border-radius: 20px; padding: 28px; max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; }
</style>
</head>
<body class="min-h-screen">

<header class="bg-white border-b border-gray-200 sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
    <div>
      <h1 class="text-xl sm:text-2xl font-bold azul-domus">💳 Boletos do Mês</h1>
      <p class="text-xs sm:text-sm text-gray-600 mt-1">Revise valor base + energia + extras antes de emitir cada boleto</p>
    </div>
    <a href="/" class="btn btn-ghost">← Voltar ao DG Gestão</a>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">

  <!-- Filtros -->
  <section class="bg-white rounded-2xl border border-gray-200 p-4 sm:p-6 mb-6">
    <div class="flex flex-wrap gap-4 items-end">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Mês de referência</label>
        <input type="month" id="mes-ref" class="border border-gray-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Unidade</label>
        <select id="filtro-unidade" class="border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option value="rib">RIB · Ribeirão Claro</option>
          <option value="ap">AP · Andrade Pertence</option>
          <option value="todas">Todas</option>
        </select>
      </div>
      <button onclick="carregarBoletos()" class="btn btn-emit">🔄 Carregar</button>
      <div class="ml-auto text-right">
        <div class="text-xs text-gray-600">Total geral do mês</div>
        <div id="total-geral" class="text-2xl font-bold azul-domus">R$ 0,00</div>
      </div>
    </div>
  </section>

  <!-- Lista -->
  <section class="bg-white rounded-2xl border border-gray-200 overflow-hidden">
    <div id="lista-boletos">
      <div class="p-12 text-center text-gray-500">Selecione mês e unidade, depois clique em Carregar</div>
    </div>
  </section>

  <!-- Footer ações -->
  <div id="footer-acoes" class="hidden mt-6 bg-white rounded-2xl border border-gray-200 p-4 flex flex-wrap gap-3 items-center justify-between">
    <div class="text-sm text-gray-700">
      <span id="qtd-resumo">0 moradoras</span> · <span class="font-bold azul-domus" id="total-resumo">R$ 0,00</span>
    </div>
    <div class="flex gap-3">
      <button onclick="salvarRascunho()" class="btn btn-ghost">💾 Salvar rascunhos</button>
      <button onclick="emitirTodos()" class="btn btn-emit">🚀 Emitir todos confirmados</button>
    </div>
  </div>
</main>

<!-- Modal status emissão -->
<div id="modal-emit" class="modal-overlay">
  <div class="modal">
    <h3 class="text-lg font-bold mb-3 azul-domus">Emitindo boletos</h3>
    <div id="modal-emit-body" class="text-sm text-gray-700"></div>
    <div class="mt-6 flex justify-end gap-2">
      <button onclick="fecharModal()" class="btn btn-ghost">Fechar</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://motwhfbpundrhvuwjntw.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vdHdoZmJwdW5kcmh2dXdqbnR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ3NDg4NjAsImV4cCI6MjA2MDMyNDg2MH0.dvLqP7BWHzVDNKTNh9RKkB-zX0pX7fG6UA4tRn6zPm0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// Default mês atual
document.getElementById('mes-ref').value = new Date().toISOString().slice(0, 7);

let dadosMes = [];

const formatBRL = (v) => Number(v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });

async function carregarBoletos() {
  const mes = document.getElementById('mes-ref').value;
  const unidade = document.getElementById('filtro-unidade').value;
  if (!mes) { alert('Escolha o mês'); return; }
  const mesPrimeiro = mes + '-01';

  const lista = document.getElementById('lista-boletos');
  lista.innerHTML = '<div class="p-8 text-center text-gray-500">Carregando...</div>';

  // Buscar moradoras ativas
  let qm = sb.from('moradores').select('*').in('status', ['ativo','ativa']);
  if (unidade !== 'todas') qm = qm.ilike('unidade', `%${unidade}%`);
  const { data: moradoras, error: errM } = await qm.order('nome');
  if (errM) { lista.innerHTML = `<div class="p-8 text-red-600">Erro: ${errM.message}</div>`; return; }

  // Buscar boletos já existentes desse mês
  const { data: boletos } = await sb.from('boletos_dominhas').select('*').eq('mes_referencia', mesPrimeiro);
  const mapBoleto = {};
  (boletos || []).forEach(b => { mapBoleto[b.morador_id] = b; });

  dadosMes = moradoras.map(m => {
    const b = mapBoleto[m.id] || {};
    return {
      morador_id: m.id,
      nome: m.nome,
      quarto: m.quarto || '—',
      unidade: m.unidade,
      valor_base: Number(b.valor_base ?? m.valor ?? 0),
      valor_energia: Number(b.valor_energia ?? 0),
      valor_extras: Number(b.valor_extras ?? 0),
      descricao_extras: b.descricao_extras || '',
      vencimento: b.data_vencimento || calcularVenc(mes, m.dia_vencimento || 15),
      status: b.status || 'rascunho',
      banco_inter_id: b.banco_inter_id,
      url_boleto: b.url_boleto,
      boleto_id: b.id,
      cpf: m.cpf,
      tem_cpf: !!(m.cpf && m.cpf.replace(/\D/g,'').length === 11),
    };
  });

  renderizar();
  document.getElementById('footer-acoes').classList.remove('hidden');
}

function calcularVenc(mes, dia) {
  return mes + '-' + String(dia).padStart(2, '0');
}

function renderizar() {
  const lista = document.getElementById('lista-boletos');
  if (dadosMes.length === 0) {
    lista.innerHTML = '<div class="p-8 text-center text-gray-500">Nenhuma moradora encontrada pra esse filtro.</div>';
    return;
  }

  let html = `
  <div class="overflow-x-auto">
  <table class="w-full text-sm">
    <thead class="bg-gray-50 border-b border-gray-200">
      <tr>
        <th class="text-left px-4 py-3 font-semibold text-gray-700">Moradora</th>
        <th class="text-left px-3 py-3 font-semibold text-gray-700">Quarto</th>
        <th class="text-right px-3 py-3 font-semibold text-gray-700">Base</th>
        <th class="text-right px-3 py-3 font-semibold text-gray-700">+ Energia</th>
        <th class="text-right px-3 py-3 font-semibold text-gray-700">+ Extras</th>
        <th class="text-left px-3 py-3 font-semibold text-gray-700 w-44">Descrição extras</th>
        <th class="text-right px-3 py-3 font-semibold text-gray-700">Total</th>
        <th class="text-left px-3 py-3 font-semibold text-gray-700">Status</th>
        <th class="text-right px-3 py-3"></th>
      </tr>
    </thead>
    <tbody>`;

  dadosMes.forEach((d, i) => {
    const total = d.valor_base + d.valor_energia + d.valor_extras;
    const stClass = `badge-${d.status}`;
    const podeEmitir = d.tem_cpf && d.status === 'rascunho';
    html += `
    <tr class="row border-b border-gray-100">
      <td class="px-4 py-3">
        <div class="font-medium">${d.nome}</div>
        ${!d.tem_cpf ? '<div class="text-xs text-red-600">⚠ Sem CPF</div>' : ''}
      </td>
      <td class="px-3 py-3 text-gray-700">${d.quarto}</td>
      <td class="px-3 py-3 text-right">
        <input type="number" class="input-num" step="0.01" value="${d.valor_base.toFixed(2)}" onchange="atualizar(${i}, 'valor_base', this.value)">
      </td>
      <td class="px-3 py-3 text-right">
        <input type="number" class="input-num" step="0.01" value="${d.valor_energia.toFixed(2)}" onchange="atualizar(${i}, 'valor_energia', this.value)">
      </td>
      <td class="px-3 py-3 text-right">
        <input type="number" class="input-num" step="0.01" value="${d.valor_extras.toFixed(2)}" onchange="atualizar(${i}, 'valor_extras', this.value)">
      </td>
      <td class="px-3 py-3">
        <input type="text" class="border border-gray-300 rounded-lg px-2 py-1 text-xs w-full" placeholder="Ex: mercado 50, multa 30" value="${d.descricao_extras||''}" onchange="atualizar(${i}, 'descricao_extras', this.value)">
      </td>
      <td class="px-3 py-3 total-cell text-right" id="total-${i}">${formatBRL(total)}</td>
      <td class="px-3 py-3"><span class="badge ${stClass}">${d.status}</span></td>
      <td class="px-3 py-3 text-right">
        ${d.url_boleto ? `<a href="${d.url_boleto}" target="_blank" class="text-xs azul-domus underline mr-2">Ver PDF</a>` : ''}
        <button class="btn btn-emit text-xs ${!podeEmitir?'opacity-40 cursor-not-allowed':''}" ${!podeEmitir?'disabled':''} onclick="emitirUm(${i})">Emitir</button>
      </td>
    </tr>`;
  });

  html += '</tbody></table></div>';
  lista.innerHTML = html;
  atualizarFooter();
}

function atualizar(i, campo, valor) {
  if (['valor_base','valor_energia','valor_extras'].includes(campo)) {
    dadosMes[i][campo] = Number(valor) || 0;
    const t = dadosMes[i].valor_base + dadosMes[i].valor_energia + dadosMes[i].valor_extras;
    document.getElementById('total-' + i).textContent = formatBRL(t);
  } else {
    dadosMes[i][campo] = valor;
  }
  atualizarFooter();
}

function atualizarFooter() {
  const total = dadosMes.reduce((s, d) => s + d.valor_base + d.valor_energia + d.valor_extras, 0);
  document.getElementById('total-geral').textContent = formatBRL(total);
  document.getElementById('total-resumo').textContent = formatBRL(total);
  document.getElementById('qtd-resumo').textContent = `${dadosMes.length} moradoras`;
}

async function salvarRascunho() {
  const mes = document.getElementById('mes-ref').value + '-01';
  const ups = dadosMes.map(d => ({
    morador_id: d.morador_id,
    morador_nome: d.nome,
    mes_referencia: mes,
    valor_base: d.valor_base,
    valor_energia: d.valor_energia,
    valor_extras: d.valor_extras,
    descricao_extras: d.descricao_extras,
    valor: d.valor_base + d.valor_energia + d.valor_extras,
    data_vencimento: d.vencimento,
    status: d.status === 'rascunho' ? 'rascunho' : d.status,
  }));
  // Usar upsert por (morador_id, mes_referencia)
  let ok = 0, err = 0;
  for (const r of ups) {
    const { error } = await sb.from('boletos_dominhas').upsert(r, { onConflict: 'morador_id,mes_referencia' });
    if (error) { err++; console.error(r.morador_nome, error); } else ok++;
  }
  alert(`Salvos: ${ok} | Erros: ${err}`);
}

async function emitirUm(i) {
  const d = dadosMes[i];
  if (!confirm(`Emitir boleto de ${d.nome}? Total: ${formatBRL(d.valor_base + d.valor_energia + d.valor_extras)}`)) return;

  abrirModal(`Emitindo boleto de ${d.nome}...`);
  const mes = document.getElementById('mes-ref').value + '-01';
  const r = await fetch(`${SUPABASE_URL}/functions/v1/inter-emit-boleto`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      morador_id: d.morador_id,
      mes_referencia: mes,
      valor: d.valor_base + d.valor_energia + d.valor_extras,
    }),
  });
  const res = await r.json();
  if (res.ok) {
    abrirModal(`<div class="text-green-700">✅ Boleto emitido!</div><div class="mt-3 text-xs">ID: ${res.banco_inter_id}<br>Vencimento: ${res.vencimento}<br><a href="${res.url_boleto}" target="_blank" class="azul-domus underline">Ver PDF</a></div>`);
    carregarBoletos();
  } else {
    abrirModal(`<div class="text-red-700">❌ Erro: ${res.erro}</div>`);
  }
}

async function emitirTodos() {
  const elegíveis = dadosMes.filter(d => d.tem_cpf && d.status === 'rascunho');
  if (elegíveis.length === 0) { alert('Nada para emitir (todas precisam de CPF e status rascunho)'); return; }
  if (!confirm(`Emitir ${elegíveis.length} boletos agora?`)) return;
  abrirModal(`Emitindo ${elegíveis.length} boletos...`);
  let ok = 0, err = 0;
  for (const d of elegíveis) {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/inter-emit-boleto`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        morador_id: d.morador_id,
        mes_referencia: document.getElementById('mes-ref').value + '-01',
        valor: d.valor_base + d.valor_energia + d.valor_extras,
      }),
    });
    const res = await r.json();
    if (res.ok) ok++; else err++;
    document.getElementById('modal-emit-body').innerHTML = `Processado ${ok+err}/${elegíveis.length} (${ok} ok, ${err} erro)...`;
  }
  abrirModal(`<div class="text-green-700">Concluído: ${ok} emitidos, ${err} erros</div>`);
  carregarBoletos();
}

function abrirModal(html) {
  document.getElementById('modal-emit-body').innerHTML = html;
  document.getElementById('modal-emit').classList.add('show');
}
function fecharModal() {
  document.getElementById('modal-emit').classList.remove('show');
}
</script>
</body>
</html>
