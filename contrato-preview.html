// ===== Helpers =====
const meses = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const dataExtenso = s => { const [y,m,d] = s.split("-"); return `${parseInt(d)} de ${meses[parseInt(m)-1]} de ${y}`; };
const fmtBR = n => Number(n||0).toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
const u = ["","um","dois","três","quatro","cinco","seis","sete","oito","nove"];
const e10 = ["dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
const d10 = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const c100 = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
function porExtenso(n) {
  if (n===0) return "zero";
  if (n<10) return u[n];
  if (n<20) return e10[n-10];
  if (n<100) { const d=Math.floor(n/10), r=n%10; return d10[d]+(r?" e "+u[r]:""); }
  if (n===100) return "cem";
  if (n<1000) { const c=Math.floor(n/100), r=n%100; return c100[c]+(r?" e "+porExtenso(r):""); }
  const m=Math.floor(n/1000), r=n%1000;
  const mil = m===1?"mil":porExtenso(m)+" mil";
  return mil+(r?(r<100?" e ":" ")+porExtenso(r):"");
}
function reaisExt(v) {
  const inteiro = Math.floor(v), cent = Math.round((v-inteiro)*100);
  let s = porExtenso(inteiro)+" reais";
  if (cent>0) s+=" e "+porExtenso(cent)+" centavos";
  return s;
}
function diasNoMes(ano, mes) { return new Date(ano, mes, 0).getDate(); }

async function carregarContrato() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) {
    document.getElementById('contrato').innerHTML = '<p style="color:red;">ID do contrato não informado. Use ?id=xxx</p>';
    return;
  }
  document.getElementById('status').textContent = 'Carregando…';
  const { data, error } = await db.rpc('obter_contrato_para_pdf', { p_admin_id: currentAdmin.admin_id, p_contrato_id: id });
  if (error || !data?.success || !data.contrato) {
    document.getElementById('contrato').innerHTML = '<p style="color:red;">Erro: ' + (data?.erro || error?.message || 'contrato não encontrado') + '</p>';
    return;

  contrato = data.contrato;
  renderizarContrato();
  document.getElementById('status').textContent = '';
}

function calcularCronograma(unidade, data_entrada, aluguel, caucao, parcelas_caucao, cortesia_dias_extras) {
  const [y,m,d] = data_entrada.split("-").map(Number);
  const ultimoDia = diasNoMes(y,m);
  const dias_cortesia = (ultimoDia - d + 1) + (cortesia_dias_extras || 0);
  const lista = [];
  const cau1 = +(caucao / parcelas_caucao).toFixed(2);
  lista.push({ data: new Date(y, m-1, d-1).toLocaleDateString("pt-BR"), valor: cau1, comp: parcelas_caucao>1 ? `Caução (1ª de ${parcelas_caucao} parcelas)` : 'Caução (parcela única)', obs: 'Vence 1 dia antes da entrada' });
  const dia01Prox = new Date(y, m, 1);
  const proRata = +((aluguel/30)*14).toFixed(2);
  lista.push({ data: dia01Prox.toLocaleDateString("pt-BR"), valor: proRata, comp: `Proporcional 14 dias (01/${String(m+1).padStart(2,'0')} a 14/${String(m+1).padStart(2,'0')})`, obs: '' });
  if (parcelas_caucao > 1) {
    const cau2dt = new Date(y, m, 15);
    lista.push({ data: cau2dt.toLocaleDateString("pt-BR"), valor: cau1, comp: 'Caução (2ª e última parcela)', obs: '' });
  }
  for (let i=0; lista.length<6; i++) {
    const dtP = new Date(y, m+1+i, 15);
    lista.push({ data: dtP.toLocaleDateString("pt-BR"), valor: aluguel, comp: `Aluguel cheio + energia (15/${String(dtP.getMonth()+1).padStart(2,'0')} a 14/${String((dtP.getMonth()+2)%12||12).padStart(2,'0')})`, obs: '' });
  }
  return { cronograma: lista, dias_cortesia };
}

      <p><strong>CONTRATADA</strong><br>${razao}<br>Representada por Gabriela Laís Egéa Dias · CPF 398.286.638-30</p>
    </div>
    <div class="assinatura">
      <p>_____________________________________________</p>
      <p><strong>CONTRATANTE</strong><br>${c.nome} · CPF ${c.cpf||'—'}</p>
    </div>
  `;
  document.getElementById('contrato').innerHTML = html;
  document.title = `Contrato — ${c.nome}`;
}

function baixarPdf() {
  if (!contrato) return;
  const opt = {
    margin: [15, 15, 15, 15],
    filename: `Contrato Domus ${contrato.unidade} - ${contrato.nome}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'] }
  };
  document.getElementById('status').textContent = 'Gerando PDF…';
  html2pdf().set(opt).from(document.getElementById('contrato')).save().then(() => {
    document.getElementById('status').textContent = 'PDF baixado ✓';
    setTimeout(() => document.getElementById('status').textContent = '', 3000);
  });
}

tentarSessao();
</script>
